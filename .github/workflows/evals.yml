name: Framework evals

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the upgrade tests build projects from older release tags
      - name: Run static evals
        run: ./evals/run-evals.sh
