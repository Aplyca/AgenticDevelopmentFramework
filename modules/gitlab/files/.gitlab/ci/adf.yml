# The framework's merge request gates, included from .gitlab-ci.yml. This file is replaced on each
# framework upgrade: set the branch model in .gitlab-ci.yml's variables (or the project's CI/CD
# variables), and change a job by redefining its keys there — the main file's keys win.
#
# Both jobs run only in merge request pipelines, in the `test` stage: a project whose `stages:`
# lists no `test` sets each job's `stage:` in .gitlab-ci.yml. No `changes:` rule on purpose: a
# required gate that never runs is not a gate. AI-generated code passes them like any other code.

# Scans only the commits this merge request adds (its diff base..its head): new secrets are blocked
# without failing on findings already in history. Uses the open-source gitleaks CLI, which fails
# the job on a finding, on every tier; GitLab's own secret detection acts on its findings (merge
# request reports, approval policies) only on Ultimate.
secret-scan:
  stage: test
  image:
    name: zricethezav/gitleaks:v8.21.2 # pin; bump deliberately
    entrypoint: ['']
  variables:
    GIT_DEPTH: '0' # the whole history, so the diff base is there
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      # A merged results pipeline builds a merge commit; the merge request's own head is the source branch's.
      head="${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-$CI_COMMIT_SHA}"
      gitleaks detect --source . \
        --config .gitleaks.toml \
        --log-opts="--no-merges ${CI_MERGE_REQUEST_DIFF_BASE_SHA}..${head}" \
        --redact --verbose --no-banner

# Fails a merge request that targets the wrong branch, and says in the job log how to fix it. The
# job token can't write merge request notes, so the failed job is the message.
#
# CUSTOMIZE in .gitlab-ci.yml's variables, one of the two models (CONTRIBUTING.md § Branching and release):
#   Integration-branch model — only ADF_ALLOWED_HEADS may target ADF_GUARDED_BASE
#     (e.g. ADF_GUARDED_BASE=main, ADF_ALLOWED_HEADS="staging hotfix/*").
#   Trunk model with an integration branch — ADF_FORBIDDEN_HEADS must never target ADF_GUARDED_BASE
#     (e.g. ADF_GUARDED_BASE=main, ADF_FORBIDDEN_HEADS="dev").
# Patterns are shell globs, space-separated. With neither set, every merge request passes.
branch-policy:
  stage: test
  image: alpine:3.20
  variables:
    GIT_STRATEGY: none # reads only the merge request's branch names
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      set -f # patterns are matched against branch names, never expanded as file globs
      base="$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      head="$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
      guarded="${ADF_GUARDED_BASE:-main}"
      ok=true
      if [ "$base" = "$guarded" ]; then
        if [ -n "${ADF_ALLOWED_HEADS:-}" ]; then
          ok=false
          for pattern in $ADF_ALLOWED_HEADS; do
            case "$head" in $pattern) ok=true ;; esac
          done
        fi
        for pattern in ${ADF_FORBIDDEN_HEADS:-}; do
          case "$head" in $pattern) ok=false ;; esac
        done
      fi
      if [ "$ok" = false ]; then
        echo "This merge request targets $base from $head."
        echo "That combination isn't part of this repository's branching model — see CONTRIBUTING.md § Branching and release."
        echo "Retarget it: glab mr update $CI_MERGE_REQUEST_IID --target-branch <the right base branch>"
        echo "(or Edit on the merge request). If no new pipeline starts, run one from its Pipelines tab."
        exit 1
      fi
      echo "$head may target $base."
