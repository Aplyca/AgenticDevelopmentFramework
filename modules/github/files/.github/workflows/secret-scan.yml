name: Secret scan

# Scans only the commits this pull request adds (base..head): new secrets are blocked without
# failing on findings already in history. Uses the open-source gitleaks binary directly — the
# gitleaks GitHub Action needs a paid license for organizations; the CLI does not. AI-generated
# code passes this gate like any other code.
#
# No `paths:` filter on purpose: a required check that never runs is not a gate.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: '8.21.2' # pin; bump deliberately
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan the commits this pull request adds
        run: |
          gitleaks detect --source . \
            --config .gitleaks.toml \
            --log-opts="--no-merges ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --redact --verbose --no-banner
