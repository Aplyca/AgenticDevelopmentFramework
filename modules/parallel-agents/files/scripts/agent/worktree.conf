# Settings for scripts/agent/worktree-*.sh. Sourced by bash; keep it to plain assignments.
# CUSTOMIZE every value marked below. Placeholders ${APP_PORT}, ${SLUG}, ${PROJECT}, ${PORT_BASE}, and
# ${PORT_N} (the worktree's Nth port, PORT_BASE + N) are expanded in every *_CMD, ENV_OVERRIDES, ISOLATED_ENV_OVERRIDES, and READY_URL.
# A worktree owns the PORT_STEP ports from ${PORT_BASE}; its app listens at APP_PORT = PORT_BASE + PORT_OFFSET.

# Branch that new work branches start from (origin/<BASE_BRANCH> when the remote has it).
BASE_BRANCH="main"                      # CUSTOMIZE: e.g. "staging" for an integration-branch model

# Where worktrees go. Empty = next to the main checkout, named after the branch with "/" → "-"
# (../feat-newsletter-signup). Keep the main checkout in a folder of its own (e.g.
# ~/code/acme/main) so its siblings are only its worktrees.
WORKTREE_PARENT=""

# Prefix for per-worktree project names (Docker Compose projects, databases). Empty = the
# repository's name (from origin's URL, else the main checkout's folder name).
PROJECT_PREFIX=""

# The per-worktree env file. Each worktree's copy is seeded from the MAIN checkout's file (never
# from the worktree the script runs in), then gets its own override block. Falls back to the
# committed template when the main checkout has none.
ENV_FILE=".env"                         # CUSTOMIZE
ENV_TEMPLATE=".env.example"             # CUSTOMIZE

# Port allocation: each worktree gets APP_PORT = PORT_RANGE_START + slot * PORT_STEP + PORT_OFFSET,
# with the slot derived from the branch name (stable across runs) and reserved under a lock so
# parallel runs can't collide. PORT_SLOTS=0 disables ports (no running app per worktree).
PORT_RANGE_START=41000
PORT_SLOTS=180
PORT_STEP=100
PORT_OFFSET=80

# Extra lines written into the worktree's env file after APP_PORT. One assignment per line. Use the
# placeholders to give each worktree its own resources, e.g. a database name: 'DB_NAME=app_${SLUG}'.
ENV_OVERRIDES='COMPOSE_PROJECT_NAME=${PROJECT}'   # CUSTOMIZE: e.g. add 'SITE_URL=http://localhost:${APP_PORT}'

# Variables that must be non-empty before the environment starts (space-separated). Fill them in
# the MAIN checkout's env file so every worktree inherits them.
REQUIRED_ENV=""                         # CUSTOMIZE: e.g. "DATABASE_URL API_TOKEN"

# Commands run inside the new worktree (skipped with --no-start). Empty = skip.
SETUP_CMD=""                            # CUSTOMIZE: host dependencies the git hooks need, e.g. "npm ci"
START_CMD=""                            # CUSTOMIZE: e.g. "docker compose up -d --build --remove-orphans"
READY_URL=""                            # CUSTOMIZE: e.g. 'http://localhost:${APP_PORT}' — polled until it answers
STOP_CMD=""                             # CUSTOMIZE: run by worktree-rm.sh, e.g. "docker compose down -v --remove-orphans"

# Isolated services (worktree-new.sh --isolated): a worktree's own copy of what siblings share by
# default — usually the database — so migrations, resets, and test data can't reach another worktree.
# Each copy costs memory and containers (docs/PARALLEL-AGENTS.md § Shared vs isolated services).
# Empty = the option is off. Keep the service's tracked config untouched: generate a working copy
# outside the repository (keyed by ${SLUG}), linking migrations and seed data back to the worktree.
ISOLATED_PORTS=0                        # CUSTOMIZE: how many ports the services bind, ${PORT_0} up (checked free with the slot)
ISOLATED_ENV_OVERRIDES=''               # CUSTOMIZE: e.g. 'DATABASE_URL=postgres://postgres:postgres@localhost:${PORT_2}/postgres'
ISOLATED_SETUP_CMD=""                   # CUSTOMIZE: files only, runs even with --no-start; idempotent, e.g. generating that working copy
ISOLATED_START_CMD=""                   # CUSTOMIZE: starts them, before START_CMD
ISOLATED_STOP_CMD=""                    # CUSTOMIZE: stops them and drops their data, run by worktree-rm.sh

# What worktree-ls.sh --info prints for each environment, run inside it: service endpoints and the
# accounts to sign in with, derived each time (from the env file, the database) — never a committed
# table, which goes stale. Empty = just the app URL (READY_URL).
ENV_INFO_CMD=""                         # CUSTOMIZE: e.g. "scripts/agent/env-info.sh"
