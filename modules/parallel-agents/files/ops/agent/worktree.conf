# Settings for ops/agent/worktree-*.sh. Sourced by bash; keep it to plain assignments.
# The defaults assume nothing about the project: each worktree gets its branch, its own copy of the
# env file (if the project has one), and nothing else. Turn on only what your project needs.
# Placeholders ${APP_PORT}, ${SLUG}, and ${PROJECT} are expanded in ENV_OVERRIDES, every *_CMD, and
# READY_URL.

# --- Every project -----------------------------------------------------------------------------

# Branch that new work branches start from (origin/<BASE_BRANCH> when the remote has it).
BASE_BRANCH="main"                      # CUSTOMIZE: e.g. "staging" for an integration-branch model

# Where worktrees go. Empty = next to the main checkout, named after the branch with "/" → "-"
# (../feat-newsletter-signup). Keep the main checkout in a folder of its own (e.g.
# ~/code/acme/main) so its siblings are only its worktrees.
WORKTREE_PARENT=""

# The per-worktree env file, when the project has one. Each worktree's copy is seeded from the MAIN
# checkout's file (never from the worktree the script runs in); without one there, from the
# committed template; without either, none is written. Empty ENV_FILE = never write one.
ENV_FILE=".env"                         # CUSTOMIZE
ENV_TEMPLATE=".env.example"             # CUSTOMIZE

# Variables that must be non-empty before the environment starts (space-separated). Fill them in
# the MAIN checkout's env file so every worktree inherits them.
REQUIRED_ENV=""                         # CUSTOMIZE: e.g. "API_TOKEN"

# Commands run inside the worktree. SETUP_CMD installs what the git hooks and tests need (also with
# --setup-only); START_CMD starts whatever a worktree runs. Both are skipped with --no-start, and
# empty = nothing to run.
SETUP_CMD=""                            # CUSTOMIZE: e.g. "npm ci", "bundle install", "uv sync"
START_CMD=""                            # CUSTOMIZE: e.g. "make up"
STOP_CMD=""                             # CUSTOMIZE: run by worktree-rm.sh, e.g. "docker compose down -v"

# What worktree-ls.sh --info prints for each worktree, run inside it — whatever someone needs to use
# that environment (its URLs, the accounts to sign in with), derived each time rather than written
# down, because a committed copy goes stale. Empty = nothing beyond the listing.
ENV_INFO_CMD=""                         # CUSTOMIZE: e.g. "make urls"

# --- Only when each worktree runs a server on the host (a web app, an API) ------------------------
# A Docker Compose stack doesn't need these: Docker picks its published ports, and the worktree's
# folder names its Compose project (decision 0032; /dev-env worktrees proposes the settings).
# Two copies of a server on the host can't listen on one port, so each worktree gets its own:
# APP_PORT = PORT_RANGE_START + slot * PORT_STEP + PORT_OFFSET, with the slot derived from the branch
# name (stable across runs) and reserved under a lock so parallel runs can't collide. The app must
# read its port from the env file. Zero slots = no ports.
PORT_SLOTS=0                            # CUSTOMIZE: e.g. 180 when worktrees run a server
PORT_RANGE_START=41000
PORT_STEP=100
PORT_OFFSET=80

# Extra lines written into the worktree's env file, one assignment per line — e.g. the app's own URL
# or a per-worktree container project name: 'SITE_URL=http://localhost:${APP_PORT}' and
# 'COMPOSE_PROJECT_NAME=${PROJECT}'.
ENV_OVERRIDES=''                        # CUSTOMIZE

# Polled after START_CMD until it answers, e.g. 'http://localhost:${APP_PORT}'. Empty = don't wait.
READY_URL=""                            # CUSTOMIZE

# Prefix for ${PROJECT}, the per-worktree name used for container projects and the like. Empty =
# the repository's name (from origin's URL, else the main checkout's folder name).
PROJECT_PREFIX=""
