# The local stack: the one Compose file, at the repository's root. The conventions are in
# .claude/rules/deployment.md § Docker.
#
# - Compose reads .env beside this file to fill each ${...}. A service gets its variables only from
#   its own `environment:`, in container form; there's no env_file:, which would hand every
#   variable to every container.
# - No container_name: and no top-level name:. Either one stops a second checkout or worktree of
#   this repository from running its own stack beside this one.
# - Each published port is "127.0.0.1:${<NAME>_PORT:-}:<port>". Leave <NAME>_PORT empty in .env and
#   Docker picks a free host port each time the service starts (`make urls` shows it); set it to
#   pin one.
# - Images are pinned, and a service another one waits for has a healthcheck.
# - A service with pages a person opens is labeled claude.browser: "true". While it runs, Claude
#   Desktop's Browser lists it on a new tab (ops/docker/launch-json.sh).
# - The checks and `make run` start the tools service, so the host needs Docker, git, and make and
#   nothing else; dependencies live in volumes, never in the checkout.

services:
  # CUSTOMIZE: the app — e.g. the newsletter site's web app
  web:
    build:
      context: .
      dockerfile: ops/docker/web/Dockerfile
      target: dev
    ports:
      # CUSTOMIZE: the port the app listens on inside the container
      - "127.0.0.1:${APP_PORT:-}:3000"
    labels:
      claude.browser: "true"
    environment:
      # CUSTOMIZE: every variable the app reads, in container form (service names, container ports)
      REDIS_URL: redis://redis:6379
      # A credential passes through from .env, e.g.
      # MAILCHIMP_API_KEY: ${MAILCHIMP_API_KEY:-}
    volumes:
      # CUSTOMIZE: the source, for reloads — the dependencies are the volume below, and build
      # folders stay out of the mount. The checkout and named volumes only, never the Docker socket or a path outside the checkout
      # (D5).
      - .:/app
      # This checkout's dependencies, which the tools service shares (D7). CUSTOMIZE: the folder the
      # install writes — e.g. node_modules for the newsletter site's Node.js app
      - deps:/app/node_modules
    depends_on:
      redis:
        condition: service_healthy

  # The tools: what make deps, test, lint, format, typecheck, and run start, one container per
  # command, removed when it ends — the stack needn't be up (D6). The tools profile keeps `make up`
  # from starting it. The checkout and named volumes only, never the Docker socket or a path outside
  # the checkout (D5): `make run` runs any command here without a prompt. A tool that needs the
  # Docker socket gets a service of its own, and its task an ask rule (D8).
  tools:
    profiles: [tools]
    build:
      context: .
      dockerfile: ops/docker/web/Dockerfile
      target: tools
    environment:
      # CUSTOMIZE: what the tests and one-off commands read — the app's variables, in container form
      REDIS_URL: redis://redis:6379
      # CUSTOMIZE: point the package manager's cache at the shared volume — e.g. for npm:
      # npm_config_cache: /cache
    volumes:
      # The whole checkout, where the app mounts it, so the checks see every file as it is on disk
      - .:/app
      - deps:/app/node_modules
      - deps-cache:/cache
    depends_on:
      # CUSTOMIZE: the backing services the tests reach. make deps, lint, format, and typecheck
      # start none (--no-deps).
      redis:
        condition: service_healthy

  # Optional: the app's production build, served beside the dev server by `make prod` only — the prod
  # profile keeps `make up` from starting it. Delete it, with the prod task and the Dockerfile's prod
  # stage, if the project has no production-like run.
  web-prod:
    profiles: [prod]
    build:
      context: .
      dockerfile: ops/docker/web/Dockerfile
      target: prod
    ports:
      # CUSTOMIZE: the port the production server listens on inside the container
      - "127.0.0.1:${APP_PROD_PORT:-}:3000"
    labels:
      claude.browser: "true"
    environment:
      # CUSTOMIZE: what the production build reads, as the app's above — no source mount: it serves
      # what the image built
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  # CUSTOMIZE: each backing service the app needs — e.g. the newsletter site's signup rate limiter
  redis:
    image: redis:7.4-alpine
    ports:
      # Published so the app can reach it from the host too (native mode)
      - "127.0.0.1:${REDIS_PORT:-}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  # This checkout's dependencies (D7). The app mounts them, so `docker compose down -v` (make reset,
  # a worktree's STOP_CMD) removes them with the checkout.
  deps:
  # The package manager's cache, which every checkout of this repository shares (D7). Compose
  # creates it on first use; only the tools service mounts it, so no task's `down -v` removes it.
  deps-cache:
    # CUSTOMIZE: the repository's name
    name: newsletter-deps-cache
